[module/bi]
type = custom/text
label = "%{T18}%{T-}"
label-foreground = ${color.mb}
label-background = ${color.bg}

[module/bd]
type = custom/text
label = "%{T18}%{T-}"
label-foreground = ${color.mb}
label-background = ${color.bg}

######################################################

[module/date]
type = internal/date
interval = 1.0
time = " %I:%M %p"
time-alt = " %a, %d %b %Y"
format = <label>
format-background = ${color.mb}
format-foreground = ${color.fg}
format-padding = 1

label = %{A3:~/.config/bin/scripts/calendar.sh:}%time%%{A}

cursor-click = pointer



######################################################

[module/network]
type = custom/script
interval = 0.1
format-background = ${color.mb}
format-padding = 1
label = %output%
format = <label>
exec = ~/.config/bin/scripts/conexion.sh

######################################################

[module/cava]
type = custom/script
tail = true
exec = $HOME/.config/bin/scripts/cava.sh
format-background = ${color.mb}
format = <label>
format-font = 1
label = %output%

[module/vpn]
type = custom/script
interval = 2
format-padding = 1
label = %output%
format = <label>
exec = ~/.config/bin/scripts/net_config/vpn.sh
click-left = ~/.config/bin/scripts/copy_ip.sh --myip

[module/target]
type = custom/script
interval = 2
format-background = ${color.background}
format-padding = 1
label = %output%
format = <label>
exec = ~/.config/bin/scripts/target.sh
click-left = ~/.config/bin/scripts/copy_ip.sh --target

######################################################

[module/pulseaudio]
type = internal/pulseaudio

use-ui-max = true
interval = 5

format-volume = <label-volume>
format-volume-prefix = ""
format-volume-prefix-font = 2
format-volume-background = ${color.mb}
format-volume-foreground = ${color.volume}

label-volume = " %percentage% "
label-volume-background = ${color.mb}
label-volume-foreground = ${color.fg}

format-muted = <label-muted>
format-muted-prefix = 
format-muted-prefix-font = 2
format-muted-foreground = ${color.volume}
format-muted-background = ${color.mb}
label-muted = " Muted "
label-muted-foreground = ${color.volume}
label-muted-background = ${color.mb}

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-3 = 
ramp-volume-4 = 

click-right = OpenApps --soundcontrol

######################################################

[module/brightness]
type = internal/backlight
card = ${system.sys_graphics_card}

enable-scroll = false

format = <ramp><label>
label = %percentage%%
label-padding-left = 3pt

ramp-0 = 
ramp-1 = 
ramp-2 = 
ramp-font = 2
ramp-foreground = ${color.pacman}

######################################################

[module/sp]
type = custom/text
content = "  "
content-background = ${color.mb}


[module/battery]
type = internal/battery
full-at = 99
battery = BAT1
adapter = ACAD
poll-interval = 2
time-format = %H:%M
format-charging = <animation-charging> <label-charging>
;;format-charging-foreground = ${color.fg-alt}
format-charging-background = ${color.mb}
format-charging-padding = 1
format-discharging = <ramp-capacity> <label-discharging>
;;format-discharging-foreground = ${color.fg-alt}
format-discharging-background = ${color.mb}
format-discharging-padding = 1
format-full = <label-full>
format-full-prefix = 
format-full-foreground = ${color.fg-alt}
format-full-background = ${color.mb}
format-full-padding = 1
label-charging = "%percentage%% "
label-discharging = "%percentage%% "
label-full = " Full "
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-framerate = 750


ramp-capacity-0-foreground = ${color.fg-alt}
ramp-capacity-1-foreground = ${color.fg-alt}
ramp-capacity-2-foreground = ${color.fg-alt}
ramp-capacity-3-foreground = ${color.fg-alt}
ramp-capacity-4-foreground = ${color.fg-alt}
ramp-capacity-5-foreground = ${color.fg-alt}
ramp-capacity-6-foreground = ${color.fg-alt}
ramp-capacity-7-foreground = ${color.fg-alt}
ramp-capacity-8-foreground = ${color.fg-alt}
ramp-capacity-9-foreground = ${color.fg-alt}
ramp-capacity-10-foreground = ${color.fg-alt}

animation-charging-0-foreground = ${color.fg-alt}
animation-charging-1-foreground = ${color.fg-alt}
animation-charging-2-foreground = ${color.fg-alt}
animation-charging-3-foreground = ${color.fg-alt}
animation-charging-4-foreground = ${color.fg-alt}
animation-charging-5-foreground = ${color.fg-alt}
animation-charging-6-foreground = ${color.fg-alt}
animation-charging-7-foreground = ${color.fg-alt}
animation-charging-8-foreground = ${color.fg-alt}
animation-charging-9-foreground = ${color.fg-alt}
animation-charging-10-foreground = ${color.fg-alt}


######################################################

[module/weather]
type = custom/script
exec = Weather wmodule
interval = 900
format = <label>
label = " %output% "



[module/bspwm]
type = internal/bspwm

enable-click = true
enable-scroll = true
reverse-scroll = true
pin-workspaces = true
occupied-scroll = false


format = <label-state>
format-font = 3

label-focused = 󰮯
label-focused-background = ${color.mb}
label-focused-padding = 1
label-focused-foreground = ${color.pacman}

label-occupied = 󰊠
label-occupied-padding = 1
label-occupied-background = ${color.mb}
label-occupied-foreground= ${color.ghost}

label-urgent = %icon%
label-urgent-padding = 0

label-empty = 󰑊
label-empty-foreground = ${color.fg-alt}
label-empty-padding = 1
label-empty-background = ${color.mb}

######################################################

[module/launcher]
type = custom/text
label = 󰒔
label-foreground = ${color.launch}
label-font = 4
click-right = /usr/local/bin/settings
click-left = rofi -show drun -show-icons -theme ~/.config/rofi/application/apps.rasi

[module/power]
type = custom/text
label = ""
label-foreground = ${color.power}
click-right = ~/.config/rofi/music/player.sh
click-left = ~/.config/rofi/power_menu/power

[module/sep]
type = custom/text
label = " "
label-foreground = ${color.bg}


[module/dots]
type = custom/text
label = " 󰇙 "
label-font = 3
label-foreground = ${color.points}


[module/playerctl]
type = custom/script
exec = ~/.config/bin/scripts/music/artist.sh
interval = 2
format-prefix = " "
format-prefix-font = 2
format = <label>
label = "%output%"         
format-background = ${color.bg}
format-foreground = ${color.fg}


[module/prev]
type = custom/text
content = "  "
content-background = ${color.mb}
content-foreground = ${color.play_alt}
content-font = 4
click-left = playerctl previous


[module/play]
type = custom/script
exec = ~/.config/bin/scripts/music/play.sh
interval = 2
tail = true
label = "%output%"         
format-background = ${color.mb}
format-foreground = ${color.fg}
click-left = ~/.config/bin/scripts/music/play.sh --click

[module/next]
type = custom/text
content = "  "
content-background = ${color.mb}
content-foreground = ${color.play_alt}
content-font = 4
click-left = playerctl next

[module/cpu-info]
type = internal/cpu
interval = 1
format = <label>
label-background = ${color.mb}
label-foreground = ${color.fg}
label = %percentage%%
format-prefix = " "
format-prefix-background = ${color.mb}
format-prefix-foreground = ${color.pc_cpu}


[module/ram-info]
type = internal/memory
interval = 1
format = <label>
label-background = ${color.mb}
label-foreground = ${color.fg}
label = %used%
format-prefix = "   "
format-prefix-background = ${color.mb}
format-prefix-foreground = ${color.pc_ram}


[module/net-info]
type = custom/script
format-background = ${color.mb}
exec = ~/.config/bin/scripts/net_display.sh
interval = 2
click-left = ~/.config/bin/scripts/net_toggle.sh
