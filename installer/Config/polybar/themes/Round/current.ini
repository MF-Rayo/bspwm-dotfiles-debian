;; Global WM Settings
[global/wm]
margin-bottom = 0
margin-top = 0

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_
;; File Inclusion
include-file = ~/.config/theme/colors/polybar.ini
;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_
;;
;;    ____  ___    ____      
;;   / __ )/   |  / __ \_____
;;  / __  / /| | / /_/ / ___/
;; / /_/ / ___ |/ _, _(__  ) 
;;/_____/_/  |_/_/ |_/____/  
;;
;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_                                       

[bar/main]
monitor =
monitor-fallback =
monitor-strict = false
bottom = true
fixed-center = true
width = 17%
height = 30
offset-x = 20
offset-y = 20
background = ${color.bg}
foreground = ${color.fg}
radius = 10
line-size = 2
line-color = ${color.ac}
border-bottom-size = 0
border-color = ${color.ac}
padding = 2
module-margin-left = 1
module-margin-right = 1

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_
;;
;;    __________  _   _____________
;;   / ____/ __ \/ | / /_  __/ ___/
;;  / /_  / / / /  |/ / / /  \__ \ 
;; / __/ / /_/ / /|  / / /  ___/ / 
;;/_/    \____/_/ |_/ /_/  /____/  
                                 
font-0 = "Iosevka Nerd Font:size=13;3"
font-1 = "Iosevka Nerd Font:bold:size=24;2"
font-2 = "Iosevka Nerd Font:size=22;6"
font-3 = "Source Code Pro:size=10;3"
font-5 = "Helvetica Rounded:style=Bold:size=10.5;3"
font-4 = "Montserrat Medium:style=Medium:size=12;3"
font-6 = "Hurmit Nerd Font Mono:style=medium:pixelsize=17;3"
;;
;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_


[bar/apps]
inherit = bar/main
width = 3%
height = 30
offset-x = 0.5%
offset-y = 15
bottom = false
foreground = ${color.fg}
background = ${color.bg}
padding = 0
modules-center = my-text-label
cursor-click = pointer
;wm-restack = bspwm

[bar/power]
inherit = bar/main
offset-x = 97.1%
offset-y = 15
width = 2.5%
height = 30
bottom = false
padding = 0
module-margin-left = 0
module-margin-right = 0
background = ${color.bg}
foreground = ${color.fg-alt}
modules-center = sysmenu
cursor-click = pointer
;wm-restack = bspwm

[bar/date]
inherit = bar/main
width = 9.2%
height = 30
offset-x = 4%
offset-y = 15
background = ${color.bg}
foreground = ${color.fg}
bottom = false
padding = 1
module-margin-left = 0
module-margin-right = 08
modules-center = date 
;wm-restack = bspwm
click-left = ~/.config/bin/scripts/calendar.sh
cursor-click = pointer

[bar/interface]
inherit = bar/main
width = 13%
height = 30
offset-x = 13.5%
offset-y = 15
background = ${color.bg}
foreground = ${color.fg}
bottom = false
padding = 1
module-margin-left = 0
module-margin-right = 0
modules-center = net-info
;wm-restack = bspwm
cursor-click = pointer

[bar/vpn]
inherit = bar/main
width = 11.5%
height = 30
offset-x = 26.82%
offset-y = 15
background = ${color.bg}
foreground = ${color.fg}
bottom = false
padding = 1
module-margin-left = 0
module-margin-right = 0
modules-center = vpn
cursor-click = pointer
;wm-restack = bspwm

[bar/target]
inherit = bar/main
width = 14.5%
height = 30
offset-x = 61.9%
offset-y = 15
background = ${color.bg}
foreground = ${color.fg}
bottom = false
font-0 = "Iosevka Nerd Font:size=11;3"
padding = 1
module-margin-left = 0
module-margin-right = 0
modules-center = target
cursor-click = pointer
;wm-restack = bspwm

[bar/cpu_ram]
inherit = bar/main
width = 11.4%
height = 30
offset-x = 76.80%
offset-y = 15
background = ${color.bg}
foreground = ${color.fg-alt}
bottom = false
font-0 = "Iosevka Nerd Font:size=11;3"
padding = 1
module-margin-left = 1
module-margin-right = 1
modules-center = cpu-info ram-info
cursor-click = pointer
;wm-restack = bspwm

[bar/battery]
inherit = bar/main
width = 8%
height = 30
offset-x = 88.5%
offset-y = 15
bottom = false
font-0 = "Iosevka Nerd Font:size=11;3"
background = ${color.bg}
format-foreground = ${color.fg-alt}
padding = 1
module-margin-left = 0
module-margin-right = 0
modules-center = alsa battery

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

; The separator will be inserted between the output of each module
separator =
spacing = 0
dim-value = 1.0
wm-name = openbox
locale = 
tray-position = none
tray-detached = false
tray-maxsize = 16
tray-transparent = false
tray-background = ${color.bg}
tray-offset-x = 0
tray-offset-y = 0
tray-padding = 0
tray-scale = 1.0
;wm-restack = bspwm
enable-ipc = true
click-left = 
click-middle = 
click-right =
scroll-up =
scroll-down =
double-click-left =
double-click-middle =
double-click-right =
cursor-click = 
cursor-scroll = 

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_
;;
;;	    __  ___          __      __         
;;	   /  |/  /___  ____/ /_  __/ /__  _____
;;	  / /|_/ / __ \/ __  / / / / / _ \/ ___/
;;	 / /  / / /_/ / /_/ / /_/ / /  __(__  ) 
;;	/_/  /_/\____/\__,_/\__,_/_/\___/____/  
;;
;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/my-text-label]
type = custom/text
content = %{T7}
click-left = rofi -show drun -show-icons -theme ~/.config/rofi/application/apps.rasi
click-right = /usr/local/bin/bspwm_settings

[module/date]
type = internal/date
interval = 1.0
time = %k : %M
date = %b %e
format = <label>
format-foreground = ${color.fg}
label = %date%  |  %time% 
label-font = 6

;; Controlar volumen

[module/alsa]
type = internal/alsa
format-volume = <ramp-volume>
format-muted = <label-muted>
label-muted = %{A3:pavucontrol &:} 婢 %{A}
label-muted-foreground = ${color.fg}
ramp-volume-0 = %{A3:pavucontrol &:} 奄%{A}
ramp-volume-1 = %{A3:pavucontrol &:} 奔%{A}
ramp-volume-2 = %{A3:pavucontrol &:} 奔%{A}
ramp-volume-3 = %{A3:pavucontrol &:} 墳%{A}
ramp-volume-4 = %{A3:pavucontrol &:} 墳%{A}
ramp-volume-foreground = ${color.fg}


[module/battery]
type = internal/battery
full-at = 99
battery = BAT1
adapter = ACAD
poll-interval = 2
time-format = %H:%M
format-charging = <animation-charging> <label-charging>
format-charging-foreground = ${color.fg}
format-charging-padding = 1
format-discharging = <ramp-capacity> <label-discharging>
format-discharging-foreground = ${color.fg}
format-discharging-padding = 1
format-full = <label-full>
format-full-prefix = 
format-full-foreground = ${color.fg-alt}
format-full-padding = 1
label-charging = "%percentage%% "
label-discharging = "%percentage%% "
label-full = " Full "
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-5 = 
ramp-capacity-6 = 
ramp-capacity-7 = 
ramp-capacity-8 = 
ramp-capacity-9 = 
ramp-capacity-10 = 
animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-5 = 
animation-charging-6 = 
animation-charging-7 = 
animation-charging-8 = 
animation-charging-9 = 
animation-charging-10 = 
animation-charging-framerate = 750

ramp-capacity-0-foreground = ${color.fg-alt}
ramp-capacity-1-foreground = ${color.fg-alt}
ramp-capacity-2-foreground = ${color.fg-alt}
ramp-capacity-3-foreground = ${color.fg-alt}
ramp-capacity-4-foreground = ${color.fg-alt}
ramp-capacity-5-foreground = ${color.fg-alt}
ramp-capacity-6-foreground = ${color.fg-alt}
ramp-capacity-7-foreground = ${color.fg-alt}
ramp-capacity-8-foreground = ${color.fg-alt}
ramp-capacity-9-foreground = ${color.fg-alt}
ramp-capacity-10-foreground = ${color.fg-alt}

animation-charging-0-foreground = ${color.fg-alt}
animation-charging-1-foreground = ${color.fg-alt}
animation-charging-2-foreground = ${color.fg-alt}
animation-charging-3-foreground = ${color.fg-alt}
animation-charging-4-foreground = ${color.fg-alt}
animation-charging-5-foreground = ${color.fg-alt}
animation-charging-6-foreground = ${color.fg-alt}
animation-charging-7-foreground = ${color.fg-alt}
animation-charging-8-foreground = ${color.fg-alt}
animation-charging-9-foreground = ${color.fg-alt}
animation-charging-10-foreground = ${color.fg-alt}

[module/net-info]
type = custom/script
exec = ~/.config/bin/scripts/net_display.sh
interval = 2
click-left = ~/.config/bin/scripts/net_toggle.sh


[module/vpn]
type = custom/script
interval = 2
exec = ~/.config/bin/scripts/net_config/vpn.sh
click-left = ~/.config/bin/scripts/copy_ip.sh --myip


[module/target]
type = custom/script
interval = 2
exec = ~/.config/bin/scripts/target.sh
click-left = ~/.config/bin/scripts/copy_ip.sh --target


[module/sysmenu]
type = custom/text
content = 襤
click-left = ~/.config/rofi/power_menu/power
click-right = ~/.config/rofi/music/player.sh


[module/cpu-info]
type = internal/cpu
interval = 1
format = <label>
label-foreground = ${color.fg}
label = %percentage%%

format-prefix = " "
format-prefix-foreground = ${color.fg-alt}


[module/ram-info]
type = internal/memory
interval = 1
format = <label>
label-foreground = ${color.fg}
label = %used%

format-prefix = " "
format-prefix-foreground = ${color.fg-alt}
