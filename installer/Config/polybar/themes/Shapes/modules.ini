;; └────────────────────────────────────────────────────────────────┘

[module/alsa]
type = internal/alsa
master-soundcard = default
speaker-soundcard = default
headphone-soundcard = default
master-mixer = Master
interval = 5
format-volume = <ramp-volume> <label-volume>
format-volume-foreground = ${color.fg}
format-volume-background = ${color.shade1}
format-volume-padding = 1
format-muted = <label-muted>
format-muted-prefix = 婢
format-muted-foreground = ${color.fg}
format-muted-background = ${color.shade1}
format-muted-padding = 1
label-volume = "%percentage%% "
label-muted = " Muted "
label-muted-foreground = ${color.fg}
ramp-volume-0 = 奄
ramp-volume-1 = 奔
ramp-volume-2 = 墳
ramp-headphones-0 = 

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/backlight]
type = internal/backlight
card = amdgpu_bl0
format = <ramp> <label>
format-background = ${color.shade2}
format-padding = 1
label = "%percentage%% "
ramp-0 = 
ramp-1 = 
ramp-2 = 
ramp-3 = 
ramp-4 = 

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/battery]
type = internal/battery
full-at = 99
battery = BAT1
adapter = ACAD
poll-interval = 2
time-format = %H:%M
format-charging = <animation-charging> <label-charging>
format-charging-foreground = ${color.fg}
format-charging-background = ${color.shade4}
format-charging-padding = 1
format-discharging = <ramp-capacity> <label-discharging>
format-discharging-foreground = ${color.fg}
format-discharging-background = ${color.shade4}
format-discharging-padding = 1
format-full = <label-full>
format-full-prefix = 
format-full-foreground = ${color.fg}
format-full-background = ${color.shade4}
format-full-padding = 1
label-charging = "%percentage%% "
label-discharging = "%percentage%% "
label-full = " Full "
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-framerate = 750

[module/net-info]
type = custom/script
format-background = ${color.shade2}
exec = ~/.config/bin/scripts/net_display.sh
interval = 2
click-left = ~/.config/bin/scripts/net_toggle.sh

[module/vpn]
type = custom/script
interval = 0.1
format-background = ${color.shade3}
format-padding = 1
label = %output%
format = <label>
cursor-click = pointer
exec = ~/.config/bin/scripts/net_config/vpn.sh
click-left = ~/.config/bin/scripts/copy_ip.sh --myip

[module/target]
type = custom/script
interval = 0.1
format-background = ${color.shade4}
format-padding = 1
label = %output%
format = <label>
cursor-click = pointer
exec = ~/.config/bin/scripts/target.sh
click-left = ~/.config/bin/scripts/copy_ip.sh --target

[module/cava]
type = custom/script
tail = true
exec = $HOME/.config/bin/scripts/cava.sh
format-background = ${color.shade3}
format = <label>
format-font = 1
label = %output%


[module/cpu-info]
type = internal/cpu
interval = 1
format = <label>
label-background = ${color.shade3}
label-foreground = ${color.fg}
label = %percentage%%

format-prefix = "  "
format-prefix-background = ${color.shade3}
format-prefix-foreground = ${color.fg-alt}


[module/ram-info]
type = internal/memory
interval = 1
format = <label>
label-background = ${color.shade3}
label-foreground = ${color.fg}
label = %used%

format-prefix = "   "
format-prefix-background = ${color.shade3}
format-prefix-foreground = ${color.fg-alt}



;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/date]
type = internal/date
interval = 1.0
time = " %I:%M %p "
time-alt = " %a, %d %b %Y "

format = <label>
label = %{A3:~/.config/bin/scripts/calendar.sh:}%time%%{A}

format-foreground = ${color.fg}
format-background = ${color.shade2}
format-padding = 1
cursor-click = pointer


;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/playerctl]
type = custom/script
exec = ~/.config/bin/scripts/music/artist.sh 
interval = 1
format-foreground = ${color.fg}
format-background = ${color.transparent}

[module/weather]
type = custom/script
interval = 600
format-padding = 1
label = %output%
format-foreground = ${color.fg}
format-background = ${color.shade3}
format = <label>
exec = ~/.config/bin/scripts/weather.sh

[module/settings]
type = custom/text
content = "  "
content-background = ${color.shade4}
content-foreground = ${color.fg}
content-padding = 1
click-left = ~/.config/polybar/themes/Shapes/style-switch.sh
cursor-click = pointer

[module/keyboard]
type = internal/xkeyboard
blacklist-0 = num lock
blacklist-1 = scroll lock
format = <label-layout> <label-indicator>
format-prefix = 
format-foreground = ${color.fg}
format-background = ${color.shade2}
format-padding = 1
label-layout = " %layout%"
label-indicator-on = %name%
label-indicator-on-foreground = ${color.fg}

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/title]
type = internal/xwindow
format = <label>
format-background = ${color.shade2}
format-padding = 1
label = " %title%"
label-maxlen = 30
label-empty = " Desktop"
label-empty-foreground = ${color.fg}

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/workspaces]
type = internal/xworkspaces
pin-workspaces = true
enable-click = true
enable-scroll = true
icon-0 = 1;
icon-1 = 2;
icon-2 = 3;
icon-3 = 4;
icon-4 = 5;
icon-default = 
format = <label-state>
label-monitor = %name%
label-active = 
label-active-foreground = ${color.fg-alt}
label-occupied = 
label-occupied-foreground = ${color.fg-alt}
label-urgent = 
label-urgent-foreground = ${color.shade2}
label-empty = 
label-empty-foreground = ${color.fg}
label-active-padding = 1
label-urgent-padding = 1
label-occupied-padding = 1
label-empty-padding = 1
;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_


;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/launcher]
type = custom/text
content = " "
content-background = ${color.shade1}
content-foreground = ${color.fg}
content-padding = 1
click-left = rofi -show drun -show-icons -theme ~/.config/rofi/application/apps.rasi
click-right = /usr/local/bin/bspwm_settings

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/sysmenu]
type = custom/text
content = "襤 "
content-background = ${color.shade1}
content-foreground = ${color.fg}
content-padding = 1
click-left = ~/.config/rofi/power_menu/power
click-right = ~/.config/rofi/music/player.sh


;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/sep]
type = custom/text
content = " | "

content-background = ${color.transparent}
content-foreground = ${color.shade1}
content-padding = 0

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/links]
type = custom/text
content-foreground = ${color.fg}
content-padding = 2

[module/google]
inherit = module/links
content = 
click-left = exo-open https://www.google.com/ &

[module/github]
inherit = module/links
content = 
click-left = exo-open https://www.github.com/ &

[module/reddit]
inherit = module/links
content = 
click-left = exo-open https://www.reddit.com/ &

[module/gmail]
inherit = module/links
content = 
click-left = exo-open https://mail.google.com/ &

[module/twitter]
inherit = module/links
content = 
click-left = exo-open https://www.twitter.com/ &

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/menu]
type = custom/menu
expand-right = true
menu-0-0 = Menu
menu-0-0-exec = rofi -show drun -show-icons -theme ~/.config/rofi/application/apps.rasi
menu-0-1 = Files
menu-0-1-exec = dolphin || thunar &
menu-0-2 = Terminal
menu-0-2-exec = kitty &
menu-0-3 = Browser
menu-0-3-exec = firefox &
format = <label-toggle> <menu>
format-background = ${color.shade1}
format-foreground = ${color.fg}
format-padding = 1
cursor-click = pointer
label-open = " 﩯"
label-close = " "
label-separator = " | "

[module/filesystem]
type = internal/fs
mount-0 = /
interval = 30
fixed-values = true
format-mounted = <label-mounted>
format-mounted-prefix = 
format-mounted-foreground = ${color.fg}
format-mounted-background = ${color.shade2}
format-mounted-padding = 2
format-unmounted = <label-unmounted>
format-unmounted-prefix = 
format-unmounted-foreground = ${color.fg}
format-unmounted-background = ${color.shade2}
format-unmounted-padding = 2
label-mounted = " %free%"
label-unmounted = " %mountpoint%: not mounted"

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

